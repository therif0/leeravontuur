<text x="26" y="183" textLength="63" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e5e510" font-weight="bold">▸1 Lees</text>
<text x="143" y="183" textLength="72" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">Gegeven:</text>
<text x="224" y="183" textLength="450" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">duid aan wat je nodig hebt (←→ en spatie, of klik)</text>
<text x="143" y="201" textLength="81" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">Gevraagd:</text>
<text x="233" y="201" textLength="9" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">◂</text>
<text x="242" y="201" textLength="261" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4"> de prijs van alle pistolets </text>
<text x="503" y="201" textLength="63" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">▸ (1/3)</text>
<text x="26" y="219" textLength="63" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" font-weight="bold"> 2 Plan</text>
<text x="143" y="219" textLength="162" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">(mag je overslaan)</text>
<text x="26" y="237" textLength="72" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" font-weight="bold"> 3 Reken</text>
<text x="143" y="237" textLength="315" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">typ hier je rekenregels: 3 x 4 = 12</text>
<text x="26" y="327" textLength="99" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" font-weight="bold"> 4 Controle</text>
<text x="125" y="327" textLength="144" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">  Emre krijgt € </text>
<text x="377" y="327" textLength="351" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4"> terug.                                </text>
<text x="62" y="417" textLength="648" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">←→ = naar een getal · spatie = aanduiden · ↓ = gevraagd · a = antwoorden</text>
