<text x="143" y="165" textLength="72" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">Gegeven:</text>
<text x="224" y="165" textLength="396" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">duid aan wat je nodig hebt (←→ en spatie, of</text>
<text x="143" y="183" textLength="81" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">Gevraagd:</text>
<text x="233" y="183" textLength="9" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">◂</text>
<text x="242" y="183" textLength="135" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4"> het begin-uur </text>
<text x="377" y="183" textLength="63" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">▸ (1/3)</text>
<text x="26" y="201" textLength="63" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" font-weight="bold"> 2 Plan</text>
<text x="143" y="201" textLength="63" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" font-weight="bold">eerst −</text>
<text x="26" y="219" textLength="72" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e5e510" font-weight="bold">▸3 Reken</text>
<text x="98" y="219" textLength="513" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">     19,45 − 95 = 18,50                                  </text>
<text x="611" y="219" textLength="9" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#cd3131" font-weight="bold">✘</text>
<text x="26" y="327" textLength="99" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" font-weight="bold"> 4 Controle</text>
<text x="125" y="327" textLength="180" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">  De film begint om </text>
<text x="413" y="327" textLength="315" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4"> u.                                </text>
<text x="44" y="381" textLength="603" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#cd3131" font-weight="bold">✘ Reken 19,45 − 95 nog eens na. Een uur heeft 60 minuten, geen 100.</text>
<text x="62" y="417" textLength="621" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">Eén stap per regel · typ x voor maal, : voor delen · Enter = nakijken</text>
