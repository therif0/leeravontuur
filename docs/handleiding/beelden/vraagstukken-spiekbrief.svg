<svg xmlns="http://www.w3.org/2000/svg" width="736" height="448" viewBox="0 0 736 448" role="img" aria-label="De spiekbrief van Vraagstukken">
<rect width="736" height="448" rx="6" fill="#1e1e1e"/>
<g font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15">
<rect x="8" y="8" width="603" height="18" fill="#11a8cd"/>
<text x="8" y="21" textLength="603" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#000000"> Leeravontuur › Leren › Wiskunde › Vraagstukken › Vra… › Spiekbrief</text>
<text x="44" y="57" textLength="234" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e5e510" font-weight="bold">EEN VRAAGSTUK IN 4 STAPPEN</text>
<text x="8" y="75" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">      1 Lees     Lees goed. Wat weet je? Wat wordt er gevraagd?                 </text>
<text x="8" y="93" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">      2 Plan     Wat moet je eerst doen, en wat daarna?                         </text>
<text x="8" y="111" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">      3 Reken    Reken stap voor stap in je klad.                               </text>
<text x="8" y="129" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">      4 Controle Schrijf een antwoordzin. Kan je antwoord kloppen?              </text>
<text x="44" y="147" textLength="504" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">  (op school: Gegeven · Gevraagd · Oplossing · Antwoord)</text>
<text x="44" y="183" textLength="306" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e5e510" font-weight="bold">SLEUTELWOORDEN (lees de hele zin!)</text>
<text x="8" y="201" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">      samen, in totaal, erbij           → meestal +                             </text>
<text x="8" y="219" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">      meer dan, minder dan, verschil    → meestal − (lees goed!)                </text>
<text x="8" y="237" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">      elk, per, keer                    → ×                                     </text>
<text x="8" y="255" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">      eerlijk verdelen, hoeveel keer    → :                                     </text>
<text x="8" y="273" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">      terug, wisselgeld                 → betaald − prijs                       </text>
<text x="8" y="291" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">      over, blijft over                 → de rest bij het delen                 </text>
<text x="44" y="327" textLength="99" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e5e510" font-weight="bold">IN HET KLAD</text>
<text x="8" y="345" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">      Typ x voor maal, : of / voor delen, - voor min.                           </text>
<text x="8" y="363" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">      Elke stap op een nieuwe regel.                                            </text>
<text x="8" y="381" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">      750 g = 0,75 kg         0,75 x 3,20 = 2,40         10 - 2,40 = 7,60       </text>
<text x="8" y="399" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">      25 : 4 = 6 rest 1       25 % van 80 = 20           3/4 van 24 = 18        </text>
<text x="530" y="417" textLength="180" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e5e510" font-weight="bold">▼ scroll voor meer ▼</text>
<rect x="8" y="422" width="9" height="18" fill="#11a8cd"/>
<rect x="17" y="422" width="36" height="18" fill="#000000"/>
<rect x="53" y="422" width="99" height="18" fill="#11a8cd"/>
<rect x="152" y="422" width="45" height="18" fill="#000000"/>
<rect x="197" y="422" width="522" height="18" fill="#11a8cd"/>
<text x="17" y="435" textLength="36" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#11a8cd" font-weight="bold">[↑↓]</text>
<text x="53" y="435" textLength="99" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#000000"> scrollen  </text>
<text x="152" y="435" textLength="45" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#11a8cd" font-weight="bold">[Esc]</text>
<text x="197" y="435" textLength="522" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#000000"> terug                                                    </text>
</g></svg>
