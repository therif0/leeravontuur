<svg xmlns="http://www.w3.org/2000/svg" width="736" height="448" viewBox="0 0 736 448" role="img" aria-label="De spiekbrief van Eenheden">
<rect width="736" height="448" rx="6" fill="#1e1e1e"/>
<g font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15">
<rect x="8" y="8" width="504" height="18" fill="#11a8cd"/>
<text x="8" y="21" textLength="504" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#000000"> Leeravontuur › Leren › Wiskunde › Eenheden › Spiekbrief</text>
<text x="44" y="57" textLength="171" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e5e510" font-weight="bold">Hoe werkt omzetten?</text>
<text x="8" y="75" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">      • Elke kolom naar rechts is 10 keer kleiner: je doet maal 10.             </text>
<text x="8" y="93" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">      • Elke kolom naar links is 10 keer groter: je doet gedeeld door 10.       </text>
<text x="8" y="111" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">      • Zet het getal in de tabel met de komma achter de eenheid die je         </text>
<text x="8" y="129" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">        krijgt.                                                                 </text>
<text x="8" y="147" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">      • Vul aan met nullen tot de eenheid die gevraagd wordt en lees af.        </text>
<text x="44" y="183" textLength="54" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e5e510" font-weight="bold">LENGTE</text>
<text x="8" y="201" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">      ┌─────┬─────┬─────┬─────┬─────┬─────┬─────┐                               </text>
<text x="8" y="219" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">      │  km │  hm │ dam │  m  │  dm │  cm │  mm │                               </text>
<text x="8" y="237" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">      └─────┴─────┴─────┴─────┴─────┴─────┴─────┘                               </text>
<text x="44" y="255" textLength="621" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#11a8cd" font-weight="bold">  1 km = 1000 m      1 m = 10 dm = 100 cm = 1000 mm      1 cm = 10 mm</text>
<text x="44" y="273" textLength="558" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">  km = kilometer, hm = hectometer, dam = decameter, m = meter,</text>
<text x="44" y="291" textLength="450" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">  dm = decimeter, cm = centimeter, mm = millimeter</text>
<text x="44" y="309" textLength="558" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">  Ezelsbruggetje: Koning Hendrik Dronk Elke Dag Chocolade Melk</text>
<text x="44" y="345" textLength="45" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e5e510" font-weight="bold">MASSA</text>
<text x="8" y="363" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">      ┌─────┬─────┬─────┬─────┬─────┬─────┬─────┬─────┬─────┬─────┐             </text>
<text x="8" y="381" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">      │  t  │100kg│ 10kg│  kg │  hg │ dag │  g  │  dg │  cg │  mg │             </text>
<text x="8" y="399" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">      └─────┴─────┴─────┴─────┴─────┴─────┴─────┴─────┴─────┴─────┘             </text>
<text x="530" y="417" textLength="180" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e5e510" font-weight="bold">▼ scroll voor meer ▼</text>
<rect x="8" y="422" width="9" height="18" fill="#11a8cd"/>
<rect x="17" y="422" width="36" height="18" fill="#000000"/>
<rect x="53" y="422" width="99" height="18" fill="#11a8cd"/>
<rect x="152" y="422" width="45" height="18" fill="#000000"/>
<rect x="197" y="422" width="522" height="18" fill="#11a8cd"/>
<text x="17" y="435" textLength="36" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#11a8cd" font-weight="bold">[↑↓]</text>
<text x="53" y="435" textLength="99" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#000000"> scrollen  </text>
<text x="152" y="435" textLength="45" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#11a8cd" font-weight="bold">[Esc]</text>
<text x="197" y="435" textLength="522" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#000000"> terug                                                    </text>
</g></svg>
