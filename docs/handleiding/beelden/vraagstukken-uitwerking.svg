<text x="35" y="129" textLength="99" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4"> betaal je </text>
<text x="134" y="129" textLength="54" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#000000">€ 0,70</text>
<text x="188" y="129" textLength="171" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">. Emre betaalt met </text>
