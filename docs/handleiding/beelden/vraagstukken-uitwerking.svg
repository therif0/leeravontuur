<text x="26" y="165" textLength="540" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">└──────────────────────────────────────────────────────────┘</text>
<text x="26" y="183" textLength="72" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" font-weight="bold">Gegeven:</text>
<text x="98" y="183" textLength="630" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">     9  ·  € 0,70  ·  € 10                                            </text>
<text x="26" y="201" textLength="81" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" font-weight="bold">Gevraagd:</text>
<text x="107" y="201" textLength="621" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">    het wisselgeld                                                   </text>
<text x="26" y="219" textLength="90" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" font-weight="bold">Oplossing:</text>
<text x="116" y="219" textLength="189" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">   9 × 0,70 = 6,30   </text>
<text x="305" y="219" textLength="261" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">← de prijs van alle pistolets</text>
<text x="8" y="237" textLength="306" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">               10 − 6,30 = 3,70   </text>
<text x="314" y="237" textLength="144" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">← het wisselgeld</text>
<text x="26" y="255" textLength="81" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" font-weight="bold">Antwoord:</text>
<text x="143" y="255" textLength="225" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#0dbc79" font-weight="bold">Emre krijgt € 3,70 terug.</text>
<text x="143" y="273" textLength="522" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">Kan dat? Het wisselgeld is minder dan de € 10 waarmee Emre</text>
<text x="143" y="291" textLength="72" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">betaalt.</text>
<text x="44" y="327" textLength="333" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#0dbc79" font-weight="bold">✔ Helemaal juist!  (16 s)  +16 punten</text>
<text x="44" y="363" textLength="378" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e5e510" font-weight="bold">Je klad is helemaal juist. Netjes gewerkt!</text>
<text x="44" y="381" textLength="387" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e5e510" font-weight="bold">Waarom? 9 pistolets van € 0,70: 9 × € 0,70.</text>
<text x="44" y="399" textLength="558" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e5e510" font-weight="bold">Waarom? Emre betaalt € 10 en alles kost € 6,30: € 10 − € 6,30.</text>
