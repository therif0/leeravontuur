<svg xmlns="http://www.w3.org/2000/svg" width="736" height="448" viewBox="0 0 736 448" role="img" aria-label="Het rapport na een reeks">
<rect width="736" height="448" rx="6" fill="#1e1e1e"/>
<g font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15">
<rect x="8" y="8" width="657" height="18" fill="#11a8cd"/>
<text x="8" y="21" textLength="657" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#000000"> Leeravontuur › Leren › Wiskunde › Hoo… › Maa… › Reeks van 10 › Resultaat</text>
<text x="44" y="57" textLength="144" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#0dbc79" font-weight="bold">Je score: 8 / 10</text>
<text x="44" y="75" textLength="153" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#0dbc79" font-weight="bold">Heel goed gedaan!</text>
<text x="44" y="93" textLength="396" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">Maal- en deeltafels · Normaal (5de leerjaar)</text>
<text x="44" y="111" textLength="405" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e5e510" font-weight="bold">★ Je verdiende 80 punten. Je hebt er nu 3180.</text>
<text x="44" y="129" textLength="279" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#11a8cd">Gemiddeld 1 seconden per vraag.</text>
<text x="44" y="165" textLength="306" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#11a8cd">Vandaag in totaal: 8 van 10 juist.</text>
<text x="44" y="201" textLength="333" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e5e510" font-weight="bold">Wat ging er mis? Lees de uitleg goed:</text>
<text x="44" y="219" textLength="621" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">Met F probeer je dezelfde vragen opnieuw, met G gelijkaardige vragen.</text>
<text x="44" y="255" textLength="171" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" font-weight="bold">Vraag 4:  6 × 3 = ?</text>
<text x="44" y="273" textLength="315" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#cd3131" font-weight="bold">   ✘ Jij schreef: 1    Juist is: 18</text>
<text x="8" y="291" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       Ken je 6 × 2 = 12? Dan nog 6 erbij: 18.                                  </text>
<text x="8" y="309" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       6 × 3 = 18                                                               </text>
<text x="44" y="345" textLength="171" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" font-weight="bold">Vraag 8:  7 × 7 = ?</text>
<text x="44" y="363" textLength="315" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#cd3131" font-weight="bold">   ✘ Jij schreef: 1    Juist is: 49</text>
<text x="8" y="381" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       Ken je 7 × 6 = 42? Dan nog 7 erbij: 49.                                  </text>
<text x="8" y="399" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       7 × 7 = 49                                                               </text>
<text x="530" y="417" textLength="180" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e5e510" font-weight="bold">▼ scroll voor meer ▼</text>
<rect x="8" y="422" width="9" height="18" fill="#11a8cd"/>
<rect x="17" y="422" width="36" height="18" fill="#000000"/>
