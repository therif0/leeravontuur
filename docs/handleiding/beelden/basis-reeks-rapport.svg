<rect x="413" y="422" width="63" height="18" fill="#000000"/>
<rect x="476" y="422" width="72" height="18" fill="#11a8cd"/>
<rect x="548" y="422" width="45" height="18" fill="#000000"/>
<rect x="593" y="422" width="126" height="18" fill="#11a8cd"/>
<text x="17" y="435" textLength="36" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#11a8cd" font-weight="bold">[↑↓]</text>
<text x="71" y="435" textLength="27" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#11a8cd" font-weight="bold">[F]</text>
<text x="98" y="435" textLength="153" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#000000"> fouten opnieuw  </text>
<text x="251" y="435" textLength="27" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#11a8cd" font-weight="bold">[G]</text>
<text x="278" y="435" textLength="135" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#000000"> gelijkaardig  </text>
<text x="413" y="435" textLength="63" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#11a8cd" font-weight="bold">[Enter]</text>
<text x="476" y="435" textLength="72" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#000000"> nieuw  </text>
<text x="548" y="435" textLength="45" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#11a8cd" font-weight="bold">[Esc]</text>
<text x="593" y="435" textLength="126" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#000000"> menu         </text>
</g></svg>
