<text x="35" y="165" textLength="522" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4"> vissen komen er in elke emmer?                           </text>
<text x="557" y="165" textLength="9" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">│</text>
<text x="26" y="183" textLength="540" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">└──────────────────────────────────────────────────────────┘</text>
<text x="26" y="201" textLength="378" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" font-weight="bold">Lotte loste het zo op. Zit er een fout in?</text>
<text x="8" y="219" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">    1.   58 + 104 = 162                                                         </text>
<rect x="44" y="224" width="153" height="18" fill="#e5e510"/>
<text x="44" y="237" textLength="153" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#000000">2.   162 : 9 = 18</text>
<text x="8" y="255" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">    3.   In elke emmer komen 18 vissen.                                         </text>
<text x="44" y="273" textLength="180" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#0dbc79" font-weight="bold">0.   Alles is juist!</text>
<text x="62" y="327" textLength="657" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">↑↓ = kies een regel · Enter = hier zit de fout (of kies &#x27;Alles is juist&#x27;)</text>
