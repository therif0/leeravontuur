<svg xmlns="http://www.w3.org/2000/svg" width="736" height="448" viewBox="0 0 736 448" role="img" aria-label="Het ouderdeel">
<rect width="736" height="448" rx="6" fill="#1e1e1e"/>
<g font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15">
<rect x="8" y="8" width="198" height="18" fill="#11a8cd"/>
<text x="8" y="21" textLength="198" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#000000"> Leeravontuur › Ouders</text>
<text x="44" y="75" textLength="81" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" font-weight="bold">Ouderdeel</text>
<rect x="62" y="98" width="216" height="18" fill="#e5e510"/>
<text x="62" y="111" textLength="216" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#000000"> 1. Rapporten           </text>
<text x="296" y="111" textLength="360" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">per dag, week, maand · kalender · export</text>
<text x="8" y="147" textLength="288" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       2. Kinderen              </text>
<text x="296" y="147" textLength="432" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">leerjaar, timer, pincode, naam, gegevens, wissen</text>
<text x="8" y="183" textLength="288" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       3. Punten                </text>
<text x="296" y="183" textLength="315" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">logboek bekijken, bonuspunten geven</text>
<text x="8" y="219" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       4. Wachtwoord wijzigen                                                   </text>
<text x="8" y="255" textLength="288" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       5. Opmerkingen (0)       </text>
<text x="296" y="255" textLength="360" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">wat er via &#x27;Zeg het ons&#x27; geschreven werd</text>
<text x="8" y="291" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       6. Sluiten                                                               </text>
<text x="44" y="345" textLength="495" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#11a8cd">Het ouderdeel sluit vanzelf na 10 minuten zonder toets.</text>
<rect x="8" y="422" width="9" height="18" fill="#11a8cd"/>
<rect x="17" y="422" width="36" height="18" fill="#000000"/>
<rect x="53" y="422" width="81" height="18" fill="#11a8cd"/>
<rect x="134" y="422" width="63" height="18" fill="#000000"/>
<rect x="197" y="422" width="45" height="18" fill="#11a8cd"/>
<rect x="242" y="422" width="45" height="18" fill="#000000"/>
<rect x="287" y="422" width="432" height="18" fill="#11a8cd"/>
<text x="17" y="435" textLength="36" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#11a8cd" font-weight="bold">[↑↓]</text>
<text x="53" y="435" textLength="81" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#000000"> kiezen  </text>
<text x="134" y="435" textLength="63" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#11a8cd" font-weight="bold">[Enter]</text>
<text x="197" y="435" textLength="45" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#000000"> ok  </text>
<text x="242" y="435" textLength="45" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#11a8cd" font-weight="bold">[Esc]</text>
<text x="287" y="435" textLength="432" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#000000"> terug                                          </text>
</g></svg>
