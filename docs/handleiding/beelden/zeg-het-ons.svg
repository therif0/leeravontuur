<svg xmlns="http://www.w3.org/2000/svg" width="736" height="448" viewBox="0 0 736 448" role="img" aria-label="Zeg het ons">
<rect width="736" height="448" rx="6" fill="#1e1e1e"/>
<g font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15">
<rect x="8" y="8" width="243" height="18" fill="#11a8cd"/>
<text x="8" y="21" textLength="243" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#000000"> Leeravontuur › Zeg het ons</text>
<text x="44" y="93" textLength="225" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" font-weight="bold">Wat wil je ons vertellen?</text>
<text x="44" y="129" textLength="648" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" text-decoration="underline"> De schatkaart is leuk!                                                 </text>
<text x="44" y="165" textLength="684" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">Iets wat je leuk vindt, te moeilijk of te makkelijk, of iets wat niet werkt.</text>
<text x="44" y="183" textLength="648" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">Het blijft op deze computer; je mama of papa kan het lezen en doorgeven.</text>
<rect x="8" y="422" width="9" height="18" fill="#11a8cd"/>
<rect x="17" y="422" width="63" height="18" fill="#000000"/>
<rect x="80" y="422" width="45" height="18" fill="#11a8cd"/>
<rect x="125" y="422" width="45" height="18" fill="#000000"/>
<rect x="170" y="422" width="549" height="18" fill="#11a8cd"/>
<text x="17" y="435" textLength="63" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#11a8cd" font-weight="bold">[Enter]</text>
<text x="80" y="435" textLength="45" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#000000"> ok  </text>
<text x="125" y="435" textLength="45" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#11a8cd" font-weight="bold">[Esc]</text>
<text x="170" y="435" textLength="549" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#000000"> terug                                                       </text>
</g></svg>
