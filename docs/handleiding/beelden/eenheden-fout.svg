<text x="62" y="183" textLength="486" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#cd3131" font-weight="bold">✘ Niet juist. Het juiste antwoord is 119000 dm.  (1 s)</text>
<text x="62" y="219" textLength="567" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e5e510" font-weight="bold">Je zit er 1 plaats naast: de komma ging 1 plaats te ver. Tel de</text>
<text x="62" y="237" textLength="297" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e5e510" font-weight="bold">kolommen van hm naar dm nog eens.</text>
<text x="62" y="255" textLength="333" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e5e510" font-weight="bold">1 hm = 1000 dm, dus doe je maal 1000.</text>
<text x="62" y="273" textLength="585" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e5e510" font-weight="bold">Van hm naar dm ga je 3 plaatsen naar rechts in de tabel: de komma</text>
<text x="62" y="291" textLength="279" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e5e510" font-weight="bold">schuift 3 plaatsen naar rechts.</text>
<text x="62" y="309" textLength="171" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e5e510" font-weight="bold">119 × 1000 = 119000</text>
