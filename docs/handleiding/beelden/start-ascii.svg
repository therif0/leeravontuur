<text x="62" y="273" textLength="432" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#cd3131" font-weight="bold">x Niet juist. Het juiste antwoord is 2/9.  (3 s)</text>
<text x="62" y="309" textLength="513" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e5e510" font-weight="bold">De balk is verdeeld in 9 gelijke stukken: de noemer is 9.</text>
<text x="62" y="327" textLength="450" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e5e510" font-weight="bold">2 stukken zijn gearceerd: de teller is 2. Dus 2/9.</text>
