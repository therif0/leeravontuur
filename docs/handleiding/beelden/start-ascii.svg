<text x="62" y="309" textLength="513" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e5e510" font-weight="bold">De balk is verdeeld in 7 gelijke stukken: de noemer is 7.</text>
<text x="62" y="327" textLength="450" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e5e510" font-weight="bold">5 stukken zijn gearceerd: de teller is 5. Dus 5/7.</text>
