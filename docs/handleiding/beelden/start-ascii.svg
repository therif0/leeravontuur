<text x="8" y="21" textLength="693" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#000000"> Leeravontuur &gt; Leren &gt; Wiskunde &gt; Breuken &gt; Breuken herkennen &gt; Vrij oefenen</text>
<text x="494" y="39" textLength="216" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e5e510" font-weight="bold">[^-^] Niet erg, probeer!</text>
<text x="44" y="57" textLength="243" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" font-weight="bold">Vrij oefenen: 0 van 1 juist</text>
<text x="44" y="75" textLength="378" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">Breuken herkennen - Normaal (5de leerjaar)</text>
<text x="62" y="129" textLength="225" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" font-weight="bold">Arceer 2/9 van de balk.  </text>
