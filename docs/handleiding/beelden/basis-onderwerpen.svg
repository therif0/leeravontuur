<svg xmlns="http://www.w3.org/2000/svg" width="736" height="448" viewBox="0 0 736 448" role="img" aria-label="De onderwerpen van Hoofdrekenen">
<rect width="736" height="448" rx="6" fill="#1e1e1e"/>
<g font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15">
<rect x="8" y="8" width="423" height="18" fill="#11a8cd"/>
<text x="8" y="21" textLength="423" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#000000"> Leeravontuur › Leren › Wiskunde › Hoofdrekenen</text>
<text x="44" y="75" textLength="297" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" font-weight="bold">Hoofdrekenen: wat wil je oefenen?</text>
<rect x="62" y="98" width="261" height="18" fill="#e5e510"/>
<text x="62" y="111" textLength="261" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#000000"> 1. Maal- en deeltafels      </text>
<text x="341" y="111" textLength="387" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">de tafels van vermenigvuldiging en de deelt</text>
<text x="8" y="147" textLength="333" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       2. Optellen en aftrekken      </text>
<text x="341" y="147" textLength="387" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">uit het hoofd optellen en aftrekken met str</text>
<text x="8" y="183" textLength="333" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       3. × en : met 10, 100, 1000   </text>
<text x="341" y="183" textLength="387" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">vermenigvuldigen en delen met 10, 100, 1000</text>
<text x="8" y="219" textLength="333" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       4. Verdubbelen en halveren    </text>
<text x="341" y="219" textLength="324" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" opacity="0.6">het dubbel en de helft uit het hoofd</text>
<rect x="8" y="422" width="9" height="18" fill="#11a8cd"/>
<rect x="17" y="422" width="36" height="18" fill="#000000"/>
<rect x="53" y="422" width="81" height="18" fill="#11a8cd"/>
<rect x="134" y="422" width="63" height="18" fill="#000000"/>
<rect x="197" y="422" width="45" height="18" fill="#11a8cd"/>
<rect x="242" y="422" width="45" height="18" fill="#000000"/>
<rect x="287" y="422" width="432" height="18" fill="#11a8cd"/>
<text x="17" y="435" textLength="36" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#11a8cd" font-weight="bold">[↑↓]</text>
<text x="53" y="435" textLength="81" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#000000"> kiezen  </text>
<text x="134" y="435" textLength="63" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#11a8cd" font-weight="bold">[Enter]</text>
<text x="197" y="435" textLength="45" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#000000"> ok  </text>
<text x="242" y="435" textLength="45" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#11a8cd" font-weight="bold">[Esc]</text>
<text x="287" y="435" textLength="432" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#000000"> terug                                          </text>
</g></svg>
